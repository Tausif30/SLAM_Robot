# One container, three windows.
#
#   docker compose pull                       download the ready-made image (about 1.5 GB)
#   docker compose up -d
#   docker compose exec robot slam sim        window 1: Gazebo
#   docker compose exec robot slam nav        window 2: Nav2 and RViz
#   docker compose exec robot slam camera     window 3: what the robot recognises
#   docker compose down
#
# To build the image yourself instead of downloading it:  docker compose build
#
# The windows appear on your screen through the X11 socket: WSLg on Windows (nothing to set up),
# or a Linux desktop (run  xhost +local:  once first).
# Windows with a GPU: also use docker-compose.wsl-gpu.yml (see the comments in that file).
name: slam_robot

services:
  robot:
    image: ghcr.io/tausif30/slam_robot:latest
    build: .
    container_name: slam
    command: ["sleep", "infinity"]     # the container just stays up; the three windows are started with 'exec'
    init: true                         # reaps the many processes Gazebo starts
    shm_size: "1gb"                    # Gazebo and Qt use shared memory
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
