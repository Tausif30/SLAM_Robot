# Parameters of the detector node. Used with:
#   ros2 run slam_robot detector_node --ros-args --params-file <this file>
detector_node:
  ros__parameters:
    use_sim_time: true
    # fine-tuned YOLO26n weights (best.pt of the training run); ~ is expanded
    model_path: "~/slam_ws/runs/detector_v1/weights/best.pt"
    image_topic: "/camera/image_raw"
    detections_topic: "/detections"
    debug_image_topic: "/detector/debug_image"
    # chosen from the confidence sweeps on the test and stress sets: the highest value at which the test set is
    # still perfect; higher values start missing real objects, lower ones let more edge slivers through
    confidence_threshold: 0.4
    max_rate_hz: 5.0          # inference takes about 18 ms, so this leaves the CPU to Gazebo and Nav2
    imgsz: 640
    device: "cpu"
    edge_margin_px: 4         # boxes this close to the image border are flagged 'truncated'
    target_label: "red_box"   # highlighted in the debug image; the locator uses it too
    publish_debug_image: true
